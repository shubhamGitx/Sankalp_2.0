<aside class="sidebar-wrapper" [class.collapsed]="collapsed">
  <div class="sidebar-container">
    
    <!-- Profile Section -->
    <div class="profile-section" *ngIf="!collapsed">
      <div class="avatar-ring-wrap">
        <div class="avatar-img">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
      </div>
      <h3 class="user-fullname">Welcome Admin</h3>
      <span class="user-email">admin@jjhm.gov.in</span>
    </div>

    <!-- Sidebar Toggle (collapses / expands the sidebar) -->
    <button class="sidebar-toggle-btn"
            [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            (click)="onToggle()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" [class.rotate]="collapsed">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Navigation List -->
    <ul class="nav-list">

      <!-- Dashboard -->
      <li class="nav-item" [class.active]="isActive('/dashboard')" (click)="openDashboard()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Dashboard</span>
      </li>

      <!-- District -->
      <li class="nav-item" [class.active]="isActive('/district')" (click)="openDistrict()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
            <line x1="9" y1="22" x2="9" y2="2"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">District</span>
      </li>

      <!-- Block -->
      <li class="nav-item" [class.active]="isActive('/block')" (click)="openBlock()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Block</span>
      </li>

      <!-- Panchayat -->
      <li class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Panchayat</span>
      </li>

      <!-- Village -->
      <li class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Village</span>
      </li>

      <!-- Reports -->
      <li class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Reports</span>
      </li>

      <!-- Gallery -->
      <li class="nav-item" [class.active]="isActive('/gallery-admin')" (click)="openGallery()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Gallery</span>
      </li>

      <!-- Settings -->
      <li class="nav-item">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Settings</span>
      </li>

      <!-- Logout -->
      <li class="nav-item logout-nav-item" (click)="openLogin()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Logout</span>
      </li>

    </ul>

    <!-- Bottom Active Users & Abstract Wave Section -->
    <div class="sidebar-bottom-section" *ngIf="!collapsed">
      <div class="active-users-wrap">
        <span class="active-users-label">ACTIVE USERS</span>
        <div class="user-avatars-row">
          <div class="mini-avatar av-1">👨</div>
          <div class="mini-avatar av-2">👩</div>
          <div class="mini-avatar av-3">🧑</div>
          <div class="mini-avatar-badge">+70</div>
        </div>
      </div>

      <!-- Abstract Glowing Wireframe Wave Mesh SVG -->
      <div class="abstract-wave-container">
        <svg viewBox="0 0 300 85" class="abstract-wave-svg" preserveAspectRatio="none">
          <defs>
            <!-- Cyan to Neon Seafoam Gradient -->
            <linearGradient id="meshCyan" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
              <stop offset="40%" stop-color="#00f5c4" stop-opacity="0.95"/>
              <stop offset="80%" stop-color="#38ef7d" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
            </linearGradient>

            <!-- Yellow/Gold to Lime Gradient -->
            <linearGradient id="meshGold" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#facc15" stop-opacity="0.15"/>
              <stop offset="35%" stop-color="#fde047" stop-opacity="0.85"/>
              <stop offset="70%" stop-color="#a3e635" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#38ef7d" stop-opacity="0.2"/>
            </linearGradient>

            <linearGradient id="meshSoft" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.1"/>
              <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#fde047" stop-opacity="0.2"/>
            </linearGradient>
          </defs>

          <!-- Cyan undulating wave ribbon lines -->
          <path d="M 0 60 Q 45 25, 100 48 T 200 35 T 300 52" fill="none" stroke="url(#meshCyan)" stroke-width="1.6"/>
          <path d="M 0 63 Q 48 28, 103 52 T 203 38 T 300 55" fill="none" stroke="url(#meshCyan)" stroke-width="1.3" opacity="0.85"/>
          <path d="M 0 66 Q 50 32, 105 55 T 205 42 T 300 58" fill="none" stroke="url(#meshCyan)" stroke-width="1.1" opacity="0.7"/>
          <path d="M 0 58 Q 42 22, 97 44 T 197 32 T 300 48" fill="none" stroke="url(#meshCyan)" stroke-width="1.2" opacity="0.75"/>

          <!-- Cross-contour / undulating connecting lines -->
          <path d="M 20 62 Q 65 35, 125 62 T 235 32 T 300 45" fill="none" stroke="url(#meshSoft)" stroke-width="1.0" opacity="0.6"/>
          <path d="M 10 52 Q 80 70, 150 40 T 255 56 T 300 38" fill="none" stroke="url(#meshSoft)" stroke-width="1.0" opacity="0.55"/>

          <!-- Yellow / Golden-Lime Wireframe Wave Ribbon -->
          <path d="M 0 70 Q 60 42, 120 68 T 230 48 T 300 65" fill="none" stroke="url(#meshGold)" stroke-width="1.7"/>
          <path d="M 0 73 Q 63 45, 123 71 T 233 51 T 300 68" fill="none" stroke="url(#meshGold)" stroke-width="1.3" opacity="0.85"/>
          <path d="M 0 76 Q 67 48, 127 74 T 237 54 T 300 72" fill="none" stroke="url(#meshGold)" stroke-width="1.1" opacity="0.75"/>
          <path d="M 0 67 Q 56 38, 116 64 T 226 45 T 300 61" fill="none" stroke="url(#meshGold)" stroke-width="1.4" opacity="0.8"/>

          <!-- Fine Grid Mesh Texture Lines -->
          <path d="M 40 70 Q 95 30, 160 66 T 270 38" fill="none" stroke="url(#meshCyan)" stroke-width="0.8" opacity="0.45"/>
          <path d="M 60 74 Q 115 36, 180 68 T 290 42" fill="none" stroke="url(#meshGold)" stroke-width="0.8" opacity="0.4"/>
          <path d="M 0 80 Q 75 52, 140 78 T 250 58 T 300 75" fill="none" stroke="url(#meshGold)" stroke-width="0.9" opacity="0.5"/>
        </svg>
      </div>
    </div>

  </div>
</aside>
