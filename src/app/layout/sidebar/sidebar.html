<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-menu-scroll">

    <!-- SECTION: MAIN -->
    <div class="menu-section">
      <span class="section-label">Main</span>
      <ul class="nav-list">
        <li>
          <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item" [title]="collapsed ? 'Dashboard' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                <rect x="3" y="16" width="7" height="5" rx="1"></rect>
              </svg>
            </span>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- SECTION: MASTERS -->
    <div class="menu-section">
      <span class="section-label">Masters</span>
      <ul class="nav-list">
        <li>
          <a routerLink="/district" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'District' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18"></path>
                <path d="M5 21V7l8-4v18"></path>
                <path d="M19 21V11l-6-4"></path>
                <path d="M9 9h1"></path>
                <path d="M9 13h1"></path>
                <path d="M9 17h1"></path>
              </svg>
            </span>
            <span class="nav-label">District</span>
          </a>
        </li>

        <li>
          <a routerLink="/block" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Block' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
            <span class="nav-label">Block</span>
          </a>
        </li>

        <li>
          <a class="nav-item" [title]="collapsed ? 'Panchayat' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </span>
            <span class="nav-label">Panchayat</span>
            <span class="nav-badge">Soon</span>
          </a>
        </li>

        <li>
          <a class="nav-item" [title]="collapsed ? 'Village' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 10a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4Z"></path>
                <path d="M10 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path>
                <circle cx="8" cy="14" r="2"></circle>
                <circle cx="16" cy="14" r="2"></circle>
                <path d="M2 20h20"></path>
              </svg>
            </span>
            <span class="nav-label">Village</span>
            <span class="nav-badge">Soon</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- SECTION: MANAGEMENT & REPORTS -->
    <div class="menu-section">
      <span class="section-label">Management</span>
      <ul class="nav-list">
        <li>
          <a routerLink="/broadcast" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Broadcast Notices' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 11 18-5v12L3 14v-3z"></path>
                <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path>
              </svg>
            </span>
            <span class="nav-label">Broadcast Notices</span>
          </a>
        </li>

        <li>
          <a routerLink="/interest-message" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Interest Advisories' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
              </svg>
            </span>
            <span class="nav-label">Interest Advisories</span>
          </a>
        </li>

        <li>
          <a routerLink="/gallery-admin" routerLinkActive="active" class="nav-item" [title]="collapsed ? 'Gallery' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                <circle cx="9" cy="9" r="2"></circle>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
              </svg>
            </span>
            <span class="nav-label">Gallery</span>
          </a>
        </li>

        <li>
          <a class="nav-item" [title]="collapsed ? 'Reports' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" x2="12" y1="20" y2="10"></line>
                <line x1="18" x2="18" y1="20" y2="4"></line>
                <line x1="6" x2="6" y1="20" y2="16"></line>
              </svg>
            </span>
            <span class="nav-label">Reports</span>
          </a>
        </li>

        <li>
          <a class="nav-item" [title]="collapsed ? 'Settings' : ''">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
            <span class="nav-label">Settings</span>
          </a>
        </li>
      </ul>
    </div>

  </div>

  <!-- SIDEBAR FOOTER (LOGOUT) -->
  <div class="sidebar-footer">
    <a (click)="openLogin()" class="nav-item logout-item" [title]="collapsed ? 'Logout' : ''">
      <span class="nav-icon logout-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" x2="9" y1="12" y2="12"></line>
        </svg>
      </span>
      <span class="nav-label">Logout</span>
    </a>
  </div>
</aside>
