<app-header
    [collapsed]="collapsed"
    (toggle)="toggleSidebar()">
</app-header>

<div class="layout">
  <app-sidebar [collapsed]="collapsed"></app-sidebar>

  <div class="main-wrapper" [class.expanded]="collapsed">
    <main class="content">
      <button class="toggle-btn" (click)="toggleSidebar()" title="Toggle sidebar">
        <span class="line saffron"></span>
        <span class="line white"></span>
        <span class="line green"></span>
      </button>

      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </div>
</div>
